<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledjon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <script>
        addEventListener("DOMContentLoaded", async () => {
            const accountButton = document.getElementById("account-button")
            const accountPopup = document.getElementById("account-popup")
            const accountDisplayName = document.getElementById("account-displayname")
            const accountDisplayNameEdit = document.getElementById("account-displayname-edit")
            const accountUsername = document.getElementById("account-username")
            const accountEditNameButton = document.getElementById("account-edit-name-button")
            const editIcon = document.getElementById("edit-icon")
            const editIconOk = document.getElementById("edit-icon-ok")

            const accountDisplayNameEditClassList = accountDisplayNameEdit.classList.toString()
            const accountPopupClassList = accountPopup.classList.toString()
            accountPopup.classList.add("hidden")
            accountDisplayNameEdit.classList.add("hidden")

            var accountPopupVisible = false



            const supabaseUrl = "https://huylrrogzvynamyfyvaf.supabase.co/functions/v1/"
            const supabaseApiKey = "sb_publishable_AKQxiJ0muIg6Y3htF9D1gg_wyU1pYbV"


            async function edgeFunction(name, method, body, enableToken = true) {
                const response = await fetch(supabaseUrl + name, {
                    method,
                    body: JSON.stringify(body),
                    headers: {
                        apikey: supabaseApiKey,
                        ...enableToken && { token }
                    }
                })
                return response.json();
            }

            const loginTokenCookie = await cookieStore.get("login_token")

            if (!loginTokenCookie) location = "/login"


            const token = loginTokenCookie.value

            const user = await edgeFunction("get-user", "GET")

            if (user.error) {
                location = "/login"
                cookieStore.delete("login_token")
            }

            accountDisplayName.innerText = user.displayName
            accountUsername.innerText = user.username


            function checkAccountPopup() {
                if (accountPopupVisible == true) {
                    accountPopup.classList = accountPopupClassList + " popup-hiding"
                    accountPopupVisible = null
                    accountPopup.blur()
                    setTimeout(() => {
                        accountPopup.classList = accountPopupClassList + " hidden"
                        accountPopupVisible = false
                    }, 200);
                } else if (accountPopupVisible == false) {
                    accountPopup.classList = accountPopupClassList + " popup-showing"
                    accountPopupVisible = null
                    setTimeout(() => {
                        accountPopup.classList = accountPopupClassList
                        accountPopup.focus()
                        accountPopupVisible = true
                    }, 200);
                }
            }

            accountButton.addEventListener("click", checkAccountPopup)
            accountPopup.addEventListener("focusout", (e) => { if (!accountPopup.contains(e.relatedTarget)) checkAccountPopup() })  // se il nuovo elemento focus non è un figlio del popup

            var accountNameEditing = false

            accountEditNameButton.addEventListener("click", () => {
                if (accountNameEditing) {
                    accountDisplayName.classList = ""
                    accountDisplayNameEdit.classList = accountDisplayNameEditClassList + " hidden"
                    accountDisplayName.innerText = accountDisplayNameEdit.value
                    editIconOk.classList = "svg-icon hidden"
                    editIcon.classList = "svg-icon"
                    accountNameEditing = false

                    edgeFunction("update-displayname", "PUT", { newDisplayName: accountDisplayNameEdit.value })
                } else {
                    accountDisplayName.classList = "hidden"
                    accountDisplayNameEdit.classList = accountDisplayNameEditClassList
                    accountDisplayNameEdit.value = accountDisplayName.innerText
                    editIconOk.classList = "svg-icon"
                    editIcon.classList = "svg-icon hidden"
                    accountNameEditing = true
                }
            })
        })
    </script>
</head>

<body>
    <div class="popup account-popup" id="account-popup" tabindex="0">
        <div class="popup-element">
            <div class="display-flex">
                <div class="icon-div big-icon-left">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="svg-icon">
                        <path
                            d="M8 9C9.38071 9 10.5 7.88071 10.5 6.5C10.5 5.11929 9.38071 4 8 4C6.61929 4 5.5 5.11929 5.5 6.5C5.5 7.88071 6.61929 9 8 9Z" />
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M8 16C12.4183 16 16 12.4183 16 8C16 3.58172 12.4183 0 8 0C3.58172 0 0 3.58172 0 8C0 12.4183 3.58172 16 8 16ZM6 10C4.80291 10 3.76957 10.7012 3.28827 11.7152C2.48151 10.6934 2 9.40294 2 8C2 4.68629 4.68629 2 8 2C11.3137 2 14 4.68629 14 8C14 9.40294 13.5185 10.6934 12.7117 11.7152C12.2304 10.7012 11.1971 10 10 10H6Z" />
                    </svg>
                </div>
                <div>
                    <div class="display-flex">
                        <div id="account-displayname"></div>
                        <input type="text" id="account-displayname-edit" class="input-edit" maxlength="20">
                        <button class="icon-button inline-margin" id="account-edit-name-button">
                            <svg class="svg-icon" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" id="edit-icon">
                                <path d="M8.29289 3.70711L1 11V15H5L12.2929 7.70711L8.29289 3.70711Z" />
                                <path
                                    d="M9.70711 2.29289L13.7071 6.29289L15.1716 4.82843C15.702 4.29799 16 3.57857 16 2.82843C16 1.26633 14.7337 0 13.1716 0C12.4214 0 11.702 0.297995 11.1716 0.828428L9.70711 2.29289Z" />
                            </svg>
                            <svg class="svg-icon hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                id="edit-icon-ok">
                                <path
                                    d="m10 19l.14-.14A2.97 2.97 0 0 1 8 16a3 3 0 0 1 3-3c1.36 0 2.5.9 2.86 2.14L20 9V7l-4-4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h6zM4 5h10v4H4zm16.04 7.13c-.14 0-.28.06-.39.17l-1 1l2.05 2.05l1-1c.22-.21.22-.56 0-.77l-1.28-1.28a.53.53 0 0 0-.38-.17m-1.97 1.75L12 19.94V22h2.06l6.06-6.07z" />
                            </svg>
                        </button>
                    </div>
                    <div id="account-username" class="small-text"></div>
                </div>
            </div>
        </div>
    </div>
    <button id="account-button">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="svg-icon">
            <path
                d="M8 9C9.38071 9 10.5 7.88071 10.5 6.5C10.5 5.11929 9.38071 4 8 4C6.61929 4 5.5 5.11929 5.5 6.5C5.5 7.88071 6.61929 9 8 9Z" />
            <path fill-rule="evenodd" clip-rule="evenodd"
                d="M8 16C12.4183 16 16 12.4183 16 8C16 3.58172 12.4183 0 8 0C3.58172 0 0 3.58172 0 8C0 12.4183 3.58172 16 8 16ZM6 10C4.80291 10 3.76957 10.7012 3.28827 11.7152C2.48151 10.6934 2 9.40294 2 8C2 4.68629 4.68629 2 8 2C11.3137 2 14 4.68629 14 8C14 9.40294 13.5185 10.6934 12.7117 11.7152C12.2304 10.7012 11.1971 10 10 10H6Z" />
        </svg>
    </button>
    <div class="page-selector">
        <button id="home-button" class="page-selector-button">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="svg-icon">
                <path
                    d="M10 19v-5h4v5c0 .55.45 1 1 1h3c.55 0 1-.45 1-1v-7h1.7c.46 0 .68-.57.33-.87L12.67 3.6c-.38-.34-.96-.34-1.34 0l-8.36 7.53c-.34.3-.13.87.33.87H5v7c0 .55.45 1 1 1h3c.55 0 1-.45 1-1" />
            </svg>
        </button>
        <button id="home-button" class="page-selector-button">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="svg-icon">
                <path
                    d="M10 19v-5h4v5c0 .55.45 1 1 1h3c.55 0 1-.45 1-1v-7h1.7c.46 0 .68-.57.33-.87L12.67 3.6c-.38-.34-.96-.34-1.34 0l-8.36 7.53c-.34.3-.13.87.33.87H5v7c0 .55.45 1 1 1h3c.55 0 1-.45 1-1" />
            </svg>
        </button>
        <button id="home-button" class="page-selector-button">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="svg-icon">
                <path
                    d="M10 19v-5h4v5c0 .55.45 1 1 1h3c.55 0 1-.45 1-1v-7h1.7c.46 0 .68-.57.33-.87L12.67 3.6c-.38-.34-.96-.34-1.34 0l-8.36 7.53c-.34.3-.13.87.33.87H5v7c0 .55.45 1 1 1h3c.55 0 1-.45 1-1" />
            </svg>
        </button>
    </div>
</body>

</html>
